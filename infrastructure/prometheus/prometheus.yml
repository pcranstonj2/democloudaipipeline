global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ingestion-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - ingestion-service:8080

  - job_name: enrichment-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - enrichment-service:9090

  - job_name: model-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - model-service:8010

  - job_name: scoring-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets:
          - scoring-orchestrator:9091

  - job_name: drift-monitor
    metrics_path: /metrics
    static_configs:
      - targets:
          - drift-monitor:9093
